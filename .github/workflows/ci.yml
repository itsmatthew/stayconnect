name: CI

on:
  pull_request:
    # edited fires when a PR's base branch changes, which stacked PRs do each time their parent merges.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # LayoutProps and friends are generated by Next; a fresh checkout does not have them yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
